twig:
    default_path: '%kernel.project_dir%/templates'
    debug: '%kernel.debug%'
    strict_variables: '%kernel.debug%'
    globals:
      dozen_price: 3.5
      # Si el servidor tiene configurados los avisos push. VACÍA = la app no
      # puede firmar ningún aviso, así que las pantallas que ofrecen activarlos
      # no deben pintar el botón: sin claves sólo puede fallar, y un botón que
      # promete algo y no lo da enseña a no fiarse de esta pantalla.
      #
      # Sólo la PÚBLICA: es la que el navegador necesita para suscribirse y no
      # es secreta. La privada no sale del servidor.
      app_vapid_public_key: '%env(VAPID_PUBLIC_KEY)%'
      # El logo que se INCRUSTA en los correos, en versión ligera (141px, 21 KB
      # frente a los 140 KB del original): un correo sale hasta ciento cuarenta y
      # cinco veces y el logo viaja dentro de cada uno.
      #
      # Se incrusta en vez de enlazarse a la web a propósito. Una imagen remota
      # la bloquean de serie varios clientes de correo hasta que quien lo recibe
      # pulsa "mostrar imágenes", y el resultado es que la asociación se presenta
      # con un cuadro roto justo a la gente que menos trato tiene con esto. La
      # incrustada se ve sin pedir permiso.
      #
      # Ruta de disco y no URL: la usa `email.image()` desde la plantilla, que la
      # lee del sistema de ficheros. No depende del symlink de assets ni de que
      # el dominio sea accesible desde donde corre el envío.
      csa_email_logo: '%kernel.project_dir%/src/Resources/public/img/csa_logo_email.png'
    paths:
      '%kernel.project_dir%/vendor/knplabs/knp-paginator-bundle/templates': KnpPaginator