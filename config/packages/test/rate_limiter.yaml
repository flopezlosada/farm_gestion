framework:
    rate_limiter:
        # El límite real (5/hora/IP) haría frágil la suite: los tests funcionales
        # comparten IP y el almacén del limitador vive en la caché de test, que
        # persiste entre casos y entre ejecuciones. A partir del sexto POST los
        # tests empezarían a fallar por agotamiento, no por el código bajo prueba.
        contact_form:
            limit: 1000
        magic_link:
            limit: 1000
